<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teplota rekrystalizace | STT</title>
<meta name="description" content="Rozcestník kapitoly: definice tváření za tepla, rekrystalizační teplota TR a teplotní interval tváření.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fbf8f3'/%3E%3Ctext x='12' y='17' font-family='Georgia,serif' font-size='12' font-weight='700' fill='%23b0561f' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="4c272434-8fc9-49a9-9a2c-b3e710506cae"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #fbf8f3; }
    a { color: inherit; text-decoration: none; }
  </style>
  <script>
    document.addEventListener('mouseover', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el) el.style.maxHeight = el.scrollHeight + 'px'; });
    document.addEventListener('mouseout', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el && !el.contains(e.relatedTarget)) el.style.maxHeight = '48px'; });
  </script>
</helmet>
<div class="site-nav-toggle" style="position:fixed;top:24px;right:24px;z-index:1000;width:220px;background:#fff;border:1px solid #e5ded2;border-radius:16px;box-shadow:0 2px 10px rgba(35,29,22,0.08);overflow:hidden;max-height:48px;transition:max-height 0.22s ease">
  <div style="height:48px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;cursor:pointer">
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
  </div>
  <div style="display:flex;flex-direction:column;border-top:1px solid #eee5d8">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
      <a href="{{ n.href }}" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">{{ n.title }}</a>
    </sc-for>
  </div>
</div>
<div style="min-height:100vh;background:#fbf8f3;font-family:'IBM Plex Sans',sans-serif;padding:56px 48px 80px;box-sizing:border-box">
  <div style="max-width:1080px;margin:0 auto 40px">
    <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14.5px;color:#8a8072;margin-bottom:18px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="#8a8072" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Zpět na Tváření
    </a>
    <h1 style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:38px;line-height:1.15;color:#231d16;margin:0 0 12px">Teplota rekrystalizace</h1>
    <p style="font-size:17px;line-height:1.6;color:#6b6255;max-width:620px;margin:0">Princip a&nbsp;podmínky procesu — proč, kdy a&nbsp;v&nbsp;jakém teplotním rozmezí se kovy tváří za tepla.</p>
  </div>

  <div style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
      <a href="{{ c.href }}" style="position:relative;display:flex;flex-direction:column;gap:16px;background:#fff;border-radius:20px;padding:26px;border:1px solid #e5ded2;box-shadow:0 1px 3px rgba(35,29,22,0.06);cursor:pointer;transition:box-shadow 0.15s,transform 0.15s" style-hover="box-shadow:0 8px 24px rgba(35,29,22,0.1);transform:translateY(-2px)">
        <div style="position:absolute;top:16px;right:16px;padding:5px 10px;border-radius:999px;background:oklch(0.95 0.025 60);font-size:11.5px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;color:oklch(0.5 0.14 60)">{{ c.badge }}</div>
        <div style="width:56px;height:56px;border-radius:14px;background:oklch(0.9 0.05 60);display:flex;align-items:center;justify-content:center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M9 3v11a4 4 0 1 0 6 0V3" stroke="oklch(0.55 0.16 60)" stroke-width="2" stroke-linecap="round"></path><path d="M9 7h6" stroke="oklch(0.55 0.16 60)" stroke-width="2" stroke-linecap="round"></path><circle cx="12" cy="17" r="2.4" fill="oklch(0.55 0.16 60)"></circle></svg>
        </div>
        <div>
          <div style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:19px;color:#231d16;margin-bottom:6px" dangerouslySetInnerHTML="{{ c.titleHtml }}"></div>
          <div style="font-size:14.5px;line-height:1.5;color:#8a8072">{{ c.desc }}</div>
        </div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CARDS = [
  { title: 'Definice', desc: 'Tváření za tepla × za studena — základní rozdíly.', href: 'Definice a zarazeni.html' },
  { title: 'Rekrystalizační teplota T<sub>R</sub>', desc: 'Hranice mezi tvářením za studena a za tepla, výpočet a příklady.', href: 'Rekrystalizacni teplota.html' },
  { title: 'Proč se tváří nad T<sub>R</sub>', desc: 'Nižší přetvárný odpor, vyšší tvárnost, žádné zpevnění.', href: 'Proc se tvari nad TR.html' },
  { title: 'Teplotní interval tváření', desc: 'Horní mez (přehřátí, spálení) a dolní mez (konec tváření).', href: 'Teplotni interval tvareni.html' },
];
const FALLBACK_NAV = [
  { title: 'Domů', href: '../../index.html' },
  { title: 'Vnitřní stavba kovů a TZ', href: '../../vnitrni-stavba-kovu-a-tz/index.html?view=home' },
  { title: 'Koroze', href: '../../koroze/index.html' },
  { title: 'Tváření', href: '../index.html' }, { title: 'Prášková metalurgie', href: '../index.dc.htmpraskova-metalurgie/index.html' },
  { title: 'O projektu', href: '../../o-projektu.html' },
  { title: 'Novinky', href: '../../novinky.html' },
];
class Component extends DCLogic {
  state = { structure: null };
  componentDidMount() {
    fetch('../../site-structure.json').then(r => r.json()).then(structure => this.setState({ structure })).catch(() => {});
  }
  renderVals() {
    const s = this.state.structure;
    const SELF = 'tvareni-za-tepla/';
    const navItems = s ? s.nav.map(n => ({ title: n.title, href: n.href.startsWith(SELF) ? '../' + n.href.slice(SELF.length) : '../../' + n.href })) : FALLBACK_NAV;
    const cards = (s ? s.coJeTvareniZaTepla.cards : CARDS).map(c => ({ ...c, badge: c.badge || '', titleHtml: { __html: c.title } }));
    return { navItems, cards };
  }
}
</script>
</body>
</html>
