<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kování a válcování | STT</title>
<meta name="description" content="Rozcestník kapitoly Kování a válcování: zápustkové a postupové kování, buchar × lis, stupeň prokování a válcování profilů.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fbf8f3'/%3E%3Ctext x='12' y='17' font-family='Georgia,serif' font-size='12' font-weight='700' fill='%23b0561f' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="4c272434-8fc9-49a9-9a2c-b3e710506cae"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #fbf8f3; }
    a { color: inherit; text-decoration: none; }
  </style>
  <script>
    document.addEventListener('mouseover', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el) el.style.maxHeight = '264px'; });
    document.addEventListener('mouseout', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el && !el.contains(e.relatedTarget)) el.style.maxHeight = '48px'; });
  </script>
</helmet>
<div class="site-nav-toggle" style="position:fixed;top:24px;right:24px;z-index:1000;width:220px;background:#fff;border:1px solid #e5ded2;border-radius:16px;box-shadow:0 2px 10px rgba(35,29,22,0.08);overflow:hidden;max-height:48px;transition:max-height 0.22s ease">
  <div style="height:48px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;cursor:pointer">
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
  </div>
  <div style="display:flex;flex-direction:column;border-top:1px solid #eee5d8">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
      <a href="{{ n.href }}" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">{{ n.title }}</a>
    </sc-for>
  </div>
</div>
<div style="min-height:100vh;background:#fbf8f3;font-family:'IBM Plex Sans',sans-serif;padding:56px 48px 80px;box-sizing:border-box">
  <div style="max-width:900px;margin:0 auto 40px">
    <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14.5px;color:#8a8072;margin-bottom:18px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="#8a8072" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      Zpět na Tváření
    </a>
    <h1 style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:38px;line-height:1.15;color:#231d16;margin:0 0 12px">Kování a válcování</h1>
    <p style="font-size:17px;line-height:1.6;color:#6b6255;max-width:640px;margin:0">Zápustkové kování — jak kov teče do dutiny, proč vzniká výronek a čím se liší buchar od lisu.</p>
  </div>

  <div style="max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:20px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
      <sc-if value="{{ c.ready }}">
        <a href="{{ c.href }}" style="position:relative;display:flex;flex-direction:column;gap:16px;background:#fff;border-radius:20px;padding:26px;border:1px solid #e5ded2;box-shadow:0 1px 3px rgba(35,29,22,0.06);cursor:pointer;transition:box-shadow 0.15s,transform 0.15s" style-hover="box-shadow:0 8px 24px rgba(35,29,22,0.1);transform:translateY(-2px)">
          <div style="width:56px;height:56px;border-radius:14px;background:oklch(0.9 0.06 60);display:flex;align-items:center;justify-content:center">{{ c.icon }}</div>
          <div>
            <div style="font-family:'Quicksand',sans-serif;font-weight:600;font-size:19px;color:#231d16;margin-bottom:6px">{{ c.title }}</div>
            <div style="font-size:14.5px;line-height:1.5;color:#8a8072">{{ c.desc }}</div>
          </div>
        </a>
      </sc-if>
      <sc-if value="{{ c.notReady }}">
        <div style="position:relative;display:flex;flex-direction:column;gap:16px;background:#faf7f1;border-radius:20px;padding:26px;border:1px solid #ece4d6;cursor:not-allowed">
          <div style="position:absolute;top:14px;right:14px;padding:5px 10px;border-radius:999px;background:#eee5d8;font-size:11px;font-weight:600;color:#a39a8b;letter-spacing:0.04em;text-transform:uppercase">Připravujeme</div>
          <div style="width:56px;height:56px;border-radius:14px;background:#eee5d8;display:flex;align-items:center;justify-content:center">{{ c.iconMuted }}</div>
          <div>
            <div style="font-family:'Quicksand',sans-serif;font-weight:600;font-size:19px;color:#a39a8b;margin-bottom:6px">{{ c.title }}</div>
            <div style="font-size:14.5px;line-height:1.5;color:#a39a8b">{{ c.desc }}</div>
          </div>
        </div>
      </sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FALLBACK_NAV = [
  { title: 'Domů', href: '../../index.html' },
  { title: 'Vnitřní stavba kovů a TZ', href: '../../vnitrni-stavba-kovu-a-tz/index.html?view=home' },
  { title: 'Koroze', href: '../../koroze/index.html' },
  { title: 'Tváření', href: '../index.html' },
  { title: 'O projektu', href: '../../o-projektu.html' },
];
const FALLBACK_CARDS = [
  { title: 'Zápustkové kování', desc: 'Plnění dutiny a vznik výronku v dělicí rovině.', href: 'Zapustkove kovani.html', status: 'ready' },
];
class Component extends DCLogic {
  state = { structure: null };
  componentDidMount() {
    fetch('../../site-structure.json').then(r => r.json()).then(structure => this.setState({ structure })).catch(() => {});
  }
  icon(key, stroke) {
    const h = React.createElement;
    const P = {
      die:    ['M4 3h16v4H4z', 'M4 17h16v4H4z', 'M9 9h6v6H9z', 'M4 12h4', 'M16 12h4'],
      steps:  ['M4 20V9h4v6', 'M10 20V6h4v9', 'M16 20V3h4v12', 'M4 20h16'],
      hammer: ['M7 3h10v4H7z', 'M12 7v10', 'M8 19l-2 2', 'M12 20v2', 'M16 19l2 2'],
      chart:  ['M5 4v15h15', 'M7 8c4 5 8 7 12 8'],
      roll:   ['M6 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0', 'M18 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0', 'M11 9.5v5', 'M13 8v8'],
    }[key] || [];
    return h('svg', { width: 30, height: 30, viewBox: '0 0 24 24', fill: 'none' },
      P.map((d, i) => h('path', { key: i, d, stroke, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' })));
  }
  iconKey(href) {
    const f = href || '';
    if (f.includes('Zapustkove')) return 'die';
    if (f.includes('Postupove')) return 'steps';
    if (f.includes('Buchar')) return 'hammer';
    if (f.includes('Stupen')) return 'chart';
    if (f.includes('Pricne') || f.includes('valcovani')) return 'roll';
    return 'die';
  }
  renderVals() {
    const s = this.state.structure;
    const SELF = 'tvareni-za-tepla/';
    const navItems = s ? s.nav.map(n => ({ title: n.title, href: n.href.startsWith(SELF) ? '../' + n.href.slice(SELF.length) : '../../' + n.href })) : FALLBACK_NAV;
    const raw = (s && s.kovani && s.kovani.cards) ? s.kovani.cards : FALLBACK_CARDS;
    const cards = raw.map(c => { const ready = c.status === 'ready'; const k = this.iconKey(c.href); return { title: c.title, desc: c.desc, href: c.href, ready, notReady: !ready, icon: this.icon(k, 'oklch(0.52 0.14 60)'), iconMuted: this.icon(k, '#b3a996') }; });
    return { navItems, cards };
  }
}
</script>
<template id="__bundler_thumbnail"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#fbf8f3"/><text x="600" y="400" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="200" fill="#b0561f">Ko</text></svg></template>
</body>
</html>
