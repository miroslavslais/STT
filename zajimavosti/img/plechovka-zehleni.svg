<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Trn protlačí přetaženou plechovku třemi kroužky v jednom zdvihu. Kroužky jsou od sebe tak daleko, že stěna je vždy jen v jednom z nich">
  <defs>
    <!-- viditelná část stěny: od konce stěny po čelo trnu; konec stěny jede v kroužku pomaleji (stálý objem) -->
    <clipPath id="stena">
      <rect x="160" y="90" width="40" height="80">
        <animate attributeName="x" values="160;182;222;238;286;302;362;382;382;160" keyTimes="0;0.06;0.18;0.22;0.38;0.42;0.65;0.7;0.8;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="width" values="40;40;48;48;60;60;88.89;88.89;88.89;40" keyTimes="0;0.06;0.18;0.22;0.38;0.42;0.65;0.7;0.8;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="600" height="260" fill="#f6f1e8"/>
  <path d="M0 130 H600" stroke="#d6cbb8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <!-- trn -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;22 0;70 0;86 0;146 0;162 0;250.89 0;270.89 0;270.89 0;0 0" keyTimes="0;0.06;0.18;0.22;0.38;0.42;0.65;0.7;0.8;1" dur="5s" repeatCount="indefinite"/>
    <rect x="70" y="110" width="130" height="40" rx="4" fill="#9aa0a6" stroke="#5f656b" stroke-width="1.5"/>
  </g>
  <!-- plechovka: pásma tloušťky stěny pevně za kroužky + dno jedoucí s trnem; po zdvihu ji stěrač stáhne -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.79;0.81;0.99;1" dur="5s" repeatCount="indefinite"/>
    <g clip-path="url(#stena)" fill="#d9dde2" stroke="#8a9096" stroke-width="0.8">
      <rect x="0" y="104" width="222" height="6"/>
      <rect x="0" y="150" width="222" height="6"/>
      <rect x="222" y="105" width="64" height="5"/>
      <rect x="222" y="150" width="64" height="5"/>
      <rect x="286" y="106" width="76" height="4"/>
      <rect x="286" y="150" width="76" height="4"/>
      <rect x="362" y="107.3" width="238" height="2.7"/>
      <rect x="362" y="150" width="238" height="2.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;22 0;70 0;86 0;146 0;162 0;250.89 0;270.89 0;270.89 0;0 0" keyTimes="0;0.06;0.18;0.22;0.38;0.42;0.65;0.7;0.8;1" dur="5s" repeatCount="indefinite"/>
      <path d="M200 104 h6 q10 26 0 52 h-6 z" fill="#d9dde2" stroke="#8a9096" stroke-width="1"/>
    </g>
  </g>
  <!-- kroužky z tvrdokovu (řez); každý další má menší otvor -->
  <g fill="#5c5346">
    <rect x="210" y="78" width="12" height="27" rx="2"/><rect x="210" y="155" width="12" height="27" rx="2"/>
    <rect x="274" y="78" width="12" height="28" rx="2"/><rect x="274" y="154" width="12" height="28" rx="2"/>
    <rect x="350" y="78" width="12" height="29.3" rx="2"/><rect x="350" y="152.7" width="12" height="29.3" rx="2"/>
  </g>
  <text x="216" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#8a8072">1.</text>
  <text x="280" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#8a8072">2.</text>
  <text x="356" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#8a8072">3.</text>
  <text x="280" y="50" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#8a8072">kroužky</text>
  <path d="M40 216 H130 M118 208 L130 216 L118 224" fill="none" stroke="#b0561f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="242" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#8a8072">trn — jeden zdvih</text>
</svg>
