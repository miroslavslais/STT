<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Postup tvarování těla plechovky: přířez, kalíšek, přetažení na menší průměr a tři stupně ztenčení stěny. Výška roste, stěna se ztenčuje, dno zůstává silné">
