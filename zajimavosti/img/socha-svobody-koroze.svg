<svg xmlns="http://www.w3.org/2000/svg" viewBox="330 30 360 216" role="img" aria-label="Řez spojem Sochy Svobody: zkorodované železné žebro v měděné sponě, elektrony přecházejí ze železa do mědi">
  <rect x="330" y="30" width="360" height="216" fill="#f6f1e8"/>
  <!-- patina a měděný plášť -->
  <rect x="330" y="52" width="360" height="8" fill="#4f9b85"/>
  <rect x="330" y="60" width="360" height="24" fill="#c27a45" stroke="#7a4320" stroke-width="1.5"/>
  <!-- provlhlá tkanina, rez, zbytek železa -->
  <rect x="442" y="126" width="116" height="100" rx="10" fill="#9db6b8" stroke="#a8916a" stroke-width="1.5"/>
  <path d="M448 150 q-8 30 6 64 q46 14 92 0 q14 -34 4 -64 q-50 -16 -102 0z" fill="#9c4a1f" stroke="#6b2f12" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </path>
  <rect x="482" y="160" width="36" height="34" rx="3" fill="#6e7378" stroke="#3e4246" stroke-width="2"/>
  <!-- roztažená měděná spona -->
  <path d="M380 84 H430 V224 Q430 240 446 240 H554 Q570 240 570 224 V84 H620" fill="none" stroke="#c27a45" stroke-width="12" stroke-linejoin="round"/>
  <!-- vytržené nýty -->
  <g fill="#c27a45" stroke="#7a4320" stroke-width="1.2">
    <rect x="394" y="52" width="12" height="32" fill="#f6f1e8" stroke="none"/><rect x="594" y="52" width="12" height="32" fill="#f6f1e8" stroke="none"/>
    <rect x="395" y="74" width="10" height="36"/><rect x="391" y="68" width="18" height="8" rx="3"/>
    <rect x="595" y="74" width="10" height="36"/><rect x="591" y="68" width="18" height="8" rx="3"/>
  </g>
  <!-- kapky vody kanou do spoje -->
  <g fill="#5aa9d6">
    <path d="M400 92 q4 6 0 9 q-4 -3 0 -9z"><animateTransform attributeName="transform" type="translate" values="0 0;30 40;54 66" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M600 92 q4 6 0 9 q-4 -3 0 -9z"><animateTransform attributeName="transform" type="translate" values="0 0;-30 40;-50 64" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></path>
  </g>
  <!-- elektrony ze železa do mědi -->
  <path id="ep" d="M500 176 C 610 176 640 120 600 96" fill="none" stroke="#e0a12a" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#e0a12a">
    <circle r="5"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#ep"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#ep"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#ep"/></animateMotion></circle>
  </g>
  <text x="640" y="150" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600" fill="#9a6a00">e⁻</text>
</svg>
