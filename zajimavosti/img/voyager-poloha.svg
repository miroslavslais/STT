<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="600" height="260" fill="#f6f1e8"/>
  <!-- heliopauza -->
  <path d="M 368.2 27.6 A 300 300 0 0 1 375.3 232.7" fill="none" stroke="#c9bfae" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="383" y="226" font-size="12" fill="#8a8072">heliopauza (2012)</text>
  <!-- dráha sondy, přerušená = měřítko neodpovídá -->
  <line x1="140" y1="131.5" x2="285" y2="106.7" stroke="#b0561f" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="305" y1="103.3" x2="478" y2="73.8" stroke="#b0561f" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="286" y1="114" x2="292" y2="98" stroke="#8a8072" stroke-width="2"/>
  <line x1="298" y1="111" x2="304" y2="95" stroke="#8a8072" stroke-width="2"/>
  <!-- signál ze sondy k Zemi -->
  <circle r="3.5" fill="#3f7fb0">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 478 73.8 L 140 131.5"/>
  </circle>
  <text x="200" y="104" font-size="12" fill="#3f7fb0">signál letí 24 h</text>
  <!-- dráha Země a Slunce -->
  <circle cx="90" cy="140" r="48" fill="none" stroke="#c9bfae" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="90" cy="140" r="16" fill="#e8a33d"/>
  <circle cx="90" cy="140" r="22" fill="#e8a33d" opacity=".25"/>
  <text x="90" y="174" font-size="13" font-weight="600" fill="#231d16" text-anchor="middle">Slunce</text>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 90 140" to="-360 90 140" dur="16s" repeatCount="indefinite"/>
    <circle cx="138" cy="140" r="6.5" fill="#3f7fb0"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 138 140" to="360 138 140" dur="16s" repeatCount="indefinite"/>
      <text x="138" y="128" font-size="13" font-weight="600" fill="#231d16" text-anchor="middle">Země</text>
    </g>
  </g>
  <!-- měřítko 1 AU -->
  <line x1="90" y1="212" x2="138" y2="212" stroke="#6b6255" stroke-width="1.5"/>
  <line x1="90" y1="207" x2="90" y2="217" stroke="#6b6255" stroke-width="1.5"/>
  <line x1="138" y1="207" x2="138" y2="217" stroke="#6b6255" stroke-width="1.5"/>
  <text x="114" y="232" font-size="12" fill="#6b6255" text-anchor="middle">1 AU</text>
  <!-- Voyager 1 -->
  <g transform="translate(500 66)">
    <line x1="-4" y1="2" x2="22" y2="-10" stroke="#6b6255" stroke-width="1.5"/>
    <rect x="-6" y="0" width="12" height="9" rx="1.5" fill="#6b6255"/>
    <ellipse cx="-2" cy="-4" rx="13" ry="4.5" fill="#fff" stroke="#6b6255" stroke-width="1.5" transform="rotate(-20 -2 -4)"/>
  </g>
  <text x="500" y="98" font-size="13" font-weight="600" fill="#231d16" text-anchor="middle">Voyager 1</text>
  <text x="500" y="114" font-size="12" fill="#6b6255" text-anchor="middle">1 světelný den</text>
  <text x="500" y="129" font-size="12" fill="#6b6255" text-anchor="middle">173,14 AU</text>
  <text x="588" y="252" font-size="11" fill="#8a8072" text-anchor="end">měřítko neodpovídá skutečnosti</text>
</svg>
