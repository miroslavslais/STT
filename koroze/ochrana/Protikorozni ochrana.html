<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protikorozní ochrana | STT</title>
<meta name="description" content="Přehled ochrany kovů: žárové zinkování, poplastování, katodová ochrana, legování, inhibitory a galvanické pokovení.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fbf8f3'/%3E%3Ctext x='12' y='17' font-family='Georgia,serif' font-size='12' font-weight='700' fill='%23b0561f' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="4c272434-8fc9-49a9-9a2c-b3e710506cae"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #080b12; }
    a { color: inherit; text-decoration: none; }
  </style>
  <script>
    document.addEventListener('mouseover', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el) el.style.maxHeight = el.scrollHeight + 'px'; });
    document.addEventListener('mouseout', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el && !el.contains(e.relatedTarget)) el.style.maxHeight = '48px'; });
    (function __navSync(){
      fetch('../../site-structure.json').then(function(r){return r.json();}).then(function(s){
        var links = document.querySelectorAll('.site-nav-toggle a');
        var SELF = 'koroze/';
        s.nav.forEach(function(item, i){
          var href = item.href.indexOf(SELF) === 0 ? '../' + item.href.slice(SELF.length) : '../../' + item.href;
          var el = links[i];
          if (el) { el.textContent = item.title; el.setAttribute('href', href); }
        });
      }).catch(function(){});
    })();
  </script>
</helmet>
<div class="site-nav-toggle" style="position:fixed;top:24px;right:24px;z-index:1000;width:220px;background:#fff;border:1px solid #e5ded2;border-radius:16px;box-shadow:0 2px 10px rgba(35,29,22,0.08);overflow:hidden;max-height:48px;transition:max-height 0.22s ease">
  <div style="height:48px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;cursor:pointer">
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
  </div>
  <div style="display:flex;flex-direction:column;border-top:1px solid #eee5d8">
    <a href="../../index.html" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">Domů</a>
    <a href="../../vnitrni-stavba-kovu-a-tz/index.html?view=home" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">Vnitřní stavba kovů a TZ</a>
    <a href="../../koroze/index.html" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">Koroze</a>
    <a href="../../tvareni-za-tepla/index.html" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">Tváření</a>
    <a href="../../o-projektu.html" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">O projektu</a>
    <a href="../../novinky.html" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">Novinky</a>
  </div>
</div>
<a href="../index.html" style="position:fixed;top:16px;left:16px;z-index:1000;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.08);backdrop-filter:blur(6px);color:#e8ecf3;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;border:1px solid rgba(255,255,255,0.14)">← Zpět na přehled</a>

<div style="min-height:100vh;background:#080b12;font-family:'IBM Plex Sans',sans-serif;padding:78px 48px 80px;box-sizing:border-box;color:#eaf2fa">
  <div style="max-width:860px;margin:0 auto">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.24em;color:oklch(0.72 0.16 35);text-transform:uppercase;margin-bottom:10px">Koroze kovů</div>
    <h1 style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:32px;line-height:1.2;margin:0 0 28px;letter-spacing:-0.01em">Protikorozní ochrana</h1>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">
      <sc-for list="{{ protections }}" as="p" hint-placeholder-count="4">
        <div style="background:rgba(120,180,230,0.05);border:1px solid rgba(120,180,230,0.16);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px">
          <div style="width:44px;height:44px;border-radius:12px;background:rgba(239,140,92,0.14);display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ p.icon }}"></div>
          <div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:17.5px;color:#eaf2fa">{{ p.name }}</div>
          <div style="font-size:14.5px;line-height:1.55;color:#aebfcf">{{ p.desc }}</div>
          <sc-if value="{{ p.animHref }}">
            <a href="{{ p.animHref }}" style="margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.06em;color:oklch(0.78 0.16 35);display:flex;align-items:center;gap:6px">Přehrát animaci
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="oklch(0.78 0.16 35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </a>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
<template id="__bundler_thumbnail"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#080b12"></rect><text x="600" y="400" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="200" fill="oklch(0.72 0.16 35)">Oc</text></svg></template>
</x-dc>
<script type="text/x-dc" data-dc-script>
const ICONS = {
  'Žárové zinkování': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="8" fill="oklch(0.55 0.02 60)"/><path d="M12 4c-3 4-3 6 0 8 3-2 3-4 0-8Z" fill="oklch(0.72 0.16 35)"/></svg>',
  'Poplastování': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="8" fill="oklch(0.55 0.02 60)"/><rect x="4" y="7" width="16" height="3" fill="oklch(0.65 0.12 165)"/></svg>',
  'Galvanické pokovení': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="14" width="16" height="4" fill="oklch(0.55 0.02 60)"/><rect x="4" y="11" width="16" height="3" fill="oklch(0.62 0.15 40)"/><rect x="4" y="8.5" width="16" height="2.2" fill="oklch(0.72 0.02 250)"/><rect x="4" y="7" width="16" height="1.3" fill="oklch(0.94 0.01 250)"/></svg>',
  'Inhibitory koroze': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" fill="none" stroke="oklch(0.65 0.12 165)" stroke-width="1.6"/><circle cx="12" cy="12" r="2" fill="oklch(0.65 0.12 165)"/></svg>',
  'Katodová ochrana': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="6" height="12" rx="1" fill="oklch(0.65 0.12 165)"/><rect x="14" y="6" width="6" height="12" rx="1" fill="oklch(0.55 0.02 60)"/><path d="M10 9h4M10 15h4" stroke="oklch(0.72 0.16 35)" stroke-width="1.6"/></svg>',
  'Legování': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="10" r="3" fill="oklch(0.55 0.02 60)"/><circle cx="15" cy="14" r="3" fill="oklch(0.65 0.12 165)"/></svg>',
};

class Component extends DCLogic {
  state = { structure: null };
  componentDidMount() {
    fetch('../../site-structure.json').then(r => r.json()).then(structure => this.setState({ structure })).catch(() => {});
  }
  renderVals() {
    const cards = this.state.structure ? this.state.structure.protikorozniOchrana.cards : [];
    return { protections: cards.map(x => ({ name: x.title, desc: x.desc, icon: { __html: ICONS[x.title] || '' }, animHref: encodeURI(x.href) })) };
  }
}
</script>
</body>
</html>
