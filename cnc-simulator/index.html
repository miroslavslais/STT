.cnc-root{
  --bg:${P.bg}; --panel:${P.panel}; --panel2:${P.panel2}; --line:${P.line}; --edge:${P.edge};
  --txt:${P.txt}; --dim:${P.dim}; --steel:${P.steel}; --cut:${P.cut};
  --feed:${P.feed}; --rapid:${P.rapid}; --tool:${P.tool}; --prog:${P.prog};
  --field:${P.field}; --btn:${P.btn}; --btn-hover:${P.btnHover}; --faint:${P.faint};
  --note:${P.note}; --cmt:${P.cmt}; --on-feed:${P.onFeed}; --err:${P.err};
  --err-gutter:${P.errGutter}; --white:${P.white}; --warn:${P.warn}; --glass:${P.glass}; --hair:${P.hair};

.cnc-root *{box-sizing:border-box}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  font-weight:600;white-space:nowrap}
.bar .fname{margin-right:auto;font-size:12px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:26%}
.bar .fname b{color:var(--txt);font-weight:600}
.bar .fname .star{color:var(--tool);font-weight:700}
.brand b{color:var(--txt);letter-spacing:.1em}
.bar .grp{display:flex;align-items:center;gap:8px}
.bar .grp.view{margin-left:10px;padding-left:12px;border-left:1px solid var(--line)}
.btn,.fbtn{transition:background .08s,border-color .08s,color .08s}
.btn{background:var(--btn);border:1px solid var(--edge);color:var(--txt);
  padding:6px 11px;border-radius:5px;font-size:12.5px;cursor:pointer;letter-spacing:.03em}
.btn:hover,.fbtn:hover{background:var(--btn-hover);border-color:var(--dim)}
.btn:active,.fbtn:active{transform:translateY(1px)}
.btn:disabled,.fbtn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--feed);outline-offset:2px}
.btn.on{background:var(--feed);border-color:var(--feed);color:var(--on-feed);font-weight:600}
.btn.on:hover{background:var(--feed);filter:brightness(1.08)}
.btn.ghost{background:transparent}
/* .btn.ghost je a\u017E za .btn.on a p\u0159i stejn\xE9 specifi\u010Dnosti mu p\u0159ebije pozad\xED na
   pr\u016Fhledn\xE9 \u2014 bez tohohle pravidla by zbyl tmav\xFD text z .btn.on na tmav\xE9m podkladu */
.btn.ghost.on{background:${P.feedSel};border-color:var(--feed);color:var(--feed);font-weight:600}
.btn.ghost.on:hover{background:${P.feedSel};filter:brightness(1.15)}
.sel{background:var(--btn);border:1px solid var(--edge);color:var(--txt);
  padding:6px 8px;border-radius:5px;font-size:12.5px}
.main{flex:1;display:flex;min-height:0}
.split{flex:none;width:6px;cursor:col-resize;background:var(--panel2);
  border-right:1px solid var(--line)}
.split:hover,.split.on{background:var(--feed)}
.left{width:393px;min-width:340px;flex:none;display:flex;flex-direction:column;
  background:var(--panel);min-height:0;overflow:hidden}
.right{flex:1;position:relative;min-width:0;background:var(--bg)}
.hd{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  padding:9px 12px 6px;font-weight:600}
.edwrap{flex:1;display:flex;min-height:140px;position:relative;border-top:1px solid var(--line)}
.gutter{width:calc(var(--ed-fs) * 3.2 + 14px);background:var(--panel2);border-right:1px solid var(--line);
  overflow:hidden;padding:10px 0;text-align:right;flex:none}
.gutter div{font-size:var(--ed-fs);line-height:var(--ed-lh);height:var(--ed-lh);padding-right:8px;color:var(--faint)}
.gutter div.act{color:var(--on-feed);background:var(--feed);font-weight:700}
.gutter div.err{color:var(--err-gutter)}
.edscroll{flex:1;position:relative;min-width:0;overflow:hidden}
.hl{position:absolute;left:0;right:0;height:var(--ed-lh);background:${P.feedGhost};z-index:0;
  border-left:2px solid var(--feed);pointer-events:none}
.ta{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;z-index:2;
  background:transparent;color:transparent;padding:10px 12px;
  font-size:var(--ed-fs);line-height:var(--ed-lh);letter-spacing:.02em;
  white-space:pre;overflow:auto;outline:none;caret-color:var(--feed)}
.ta::selection{background:${P.feedSel}}
.hlite{position:absolute;inset:0;margin:0;padding:10px 12px;z-index:1;
  font-size:var(--ed-fs);line-height:var(--ed-lh);letter-spacing:.02em;white-space:pre;
  overflow:hidden;pointer-events:none;color:var(--txt)}
.hlite .ln{display:block;height:var(--ed-lh)}
.c-cmt{color:var(--cmt);font-style:italic}
.c-n{color:var(--faint)}
.c-rapid{color:var(--rapid)}
.c-feed{color:var(--feed)}
.c-g{color:${P.gcode}}
.c-m{color:var(--tool)}
.c-f{color:${P.fword}}
.filerow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 12px 8px}
.filerow .grp{display:flex;align-items:center;gap:6px}
.filerow .grp.right{flex-basis:100%;margin-top:2px}
.filerow .grp .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.filerow .name{margin-left:auto;font-size:11.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.filerow .name b{color:var(--txt);font-weight:600}
.filerow .dot{color:var(--tool)}
.fbtn{background:var(--btn);border:1px solid var(--edge);color:var(--txt);
  padding:4px 9px;border-radius:5px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.fbtn:hover{background:var(--btn-hover)}
.fbtn:focus-visible{outline:2px solid var(--feed);outline-offset:2px}
.fbtn.on{background:var(--feed);border-color:var(--feed);color:var(--on-feed);font-weight:600}
.fbtn.on:hover{background:var(--feed);filter:brightness(1.08)}
.ovl{position:absolute;inset:0;background:${P.veil};display:flex;
  align-items:center;justify-content:center;z-index:20;padding:20px}
.dlg{background:var(--panel);border:1px solid var(--edge);border-radius:6px;
  padding:0 0 14px;width:min(420px,100%);box-shadow:0 18px 50px ${P.shadow};overflow:hidden}
.dlg h3{margin:0 0 10px;padding:9px 14px 8px;background:var(--panel2);
  border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);font-weight:600}
.dlg p{margin:0 14px 10px;font-size:12.5px;line-height:1.5;color:var(--txt)}
.dlg .inp{width:calc(100% - 28px);margin:0 14px}
.dlg.wide{width:min(560px,92vw)}
.dlg .about{margin:0 14px 4px;font-size:12.5px;line-height:1.6;color:var(--txt)}
.dlg .about h4{margin:0 0 2px;font-size:15px;color:var(--feed)}
.dlg .about .ver{color:var(--dim);font-size:11.5px;letter-spacing:.04em}
.dlg .about .lic{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px}
.dlg .about a{color:var(--feed)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin:14px 14px 0;
  padding-top:12px;border-top:1px solid var(--line)}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);padding:9px 2px;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;cursor:pointer}
.tabs button:hover{color:var(--txt);background:${P.feedGhost}}
.tabs button.on{color:var(--txt);border-bottom-color:var(--feed);background:${P.feedGhost}}
/* stavov\xE1 te\u010Dka u z\xE1lo\u017Eky Kontrola \u2014 sv\xEDt\xED jako kontrolka na p\u0159\xEDstrojov\xE9 desce */
.tabs [class^="dot-"]{display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-left:6px;vertical-align:middle;position:relative;top:-1px}
.dot-err{background:${P.dotErr};box-shadow:0 0 6px ${P.dotErr},0 0 2px ${P.dotErr}}
.dot-warn{background:${P.dotWarn};box-shadow:0 0 6px ${P.dotWarn},0 0 2px ${P.dotWarn}}
.dot-ok{background:${P.dotOk};box-shadow:0 0 6px ${P.dotOk},0 0 2px ${P.dotOk}}
@media (prefers-reduced-motion:no-preference){
  .dot-err{animation:dotPulse 1.6s ease-in-out infinite}
}
@keyframes dotPulse{50%{opacity:.45}}
.tabs .info{display:inline-block;margin-left:6px;width:14px;height:14px;line-height:13px;
  border-radius:50%;border:1px solid var(--tool);color:var(--tool);background:transparent;
  font-size:10px;font-weight:700;font-style:italic;text-align:center;cursor:pointer;
  vertical-align:middle;position:relative;top:-1px;padding:0}
.tabs .info:hover{background:var(--tool);color:${P.onBadge}}
.tabs .info.on{background:var(--tool);color:${P.onBadge}}
.tabs .badge{display:inline-block;margin-left:5px;background:var(--rapid);color:${P.onBadge};
  border-radius:8px;padding:0 5px;font-size:10px}
.pane{height:224px;overflow:auto;padding:10px 12px 14px}
.grid3{display:grid;grid-template-columns:auto 1fr 1fr;gap:7px 9px;align-items:center}
.grid3 .ax{font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.inp{background:var(--field);border:1px solid var(--edge);color:var(--txt);
  border-radius:4px;padding:5px 6px;font-size:12.5px;width:100%;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.inp:focus{outline:1px solid var(--feed);border-color:var(--feed)}
.note{font-size:11px;color:var(--dim);line-height:1.5;margin-top:10px}
.note b{color:var(--note)}
.trow{display:grid;grid-template-columns:44px 1fr 66px 50px;gap:7px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--hair)}
.msg{font-size:11.5px;line-height:1.45;padding:3px 0;color:var(--err);display:flex;gap:7px}
.msg .n{color:var(--dim);flex:none}
.msg.warn{color:var(--warn)}
.msg.ok{color:var(--dim)}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);padding:3px 0}
.chk input{accent-color:var(--feed)}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.dro{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--glass);
  border:1px solid var(--line);border-radius:6px;padding:9px 4px;
  display:flex;align-items:stretch;pointer-events:none;backdrop-filter:blur(3px);
  max-width:calc(100% - 28px);flex-wrap:wrap;justify-content:center}
.dro .g{display:flex;gap:14px;padding:0 14px;border-left:1px solid var(--line);flex-wrap:wrap}
.dro{row-gap:8px}
.dro .g:first-child{border-left:0}
.dro .k{font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.dro .v{font-size:16px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.dro .g.pos .v{font-size:20px}
.dro .g.cond .v{font-size:14px}
.dro .v.warnv{color:var(--tool)}
.stats{position:absolute;right:78px;top:14px;background:var(--glass);
  border:1px solid var(--line);border-radius:6px;padding:9px 12px;
  color:var(--dim);pointer-events:none;backdrop-filter:blur(3px);
  display:grid;grid-template-columns:auto auto;gap:5px 14px;align-items:baseline}
.stats .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stats .v{font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap;text-align:right}
.stats .hint{grid-column:1 / -1;font-size:11.5px}
.legend{position:absolute;left:14px;top:14px;display:flex;gap:10px 14px;align-items:center;
  font-size:11px;color:var(--dim);pointer-events:none;max-width:calc(100% - 210px);
  flex-wrap:wrap}
.legend span{white-space:nowrap}
.legend .min{pointer-events:auto;flex:none;order:-1;width:18px;height:18px;line-height:16px;
  border-radius:50%;border:1px solid var(--edge);background:var(--panel);color:var(--dim);
  font-size:12px;text-align:center;cursor:pointer;padding:0}
.legend .min:hover{background:var(--btn-hover);color:var(--txt);border-color:var(--dim)}
.legpill{position:absolute;left:14px;top:14px;background:var(--glass);
  border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--dim);
  font-size:11px;cursor:pointer}
.legpill:hover{color:var(--txt);border-color:var(--dim)}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;
  margin-right:6px;vertical-align:middle}
.slider{width:118px;accent-color:var(--feed)}
.cnc-root.proj .dro{padding:12px 6px}
.dro .min{position:absolute;top:-9px;right:-9px;width:20px;height:20px;line-height:18px;
  border-radius:50%;border:1px solid var(--edge);background:var(--panel);color:var(--dim);
  font-size:13px;text-align:center;cursor:pointer;pointer-events:auto;padding:0}
.dro .min:hover{background:var(--btn-hover);color:var(--txt);border-color:var(--dim)}
.dropill{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  background:var(--glass);border:1px solid var(--line);border-radius:6px;
  padding:7px 13px;color:var(--dim);font-size:14px;cursor:pointer;backdrop-filter:blur(3px)}
.dropill:hover{color:var(--txt);border-color:var(--dim)}
.cnc-root.proj .dro .g{gap:18px;padding:0 18px}
.cnc-root.proj .dro .k{font-size:11.5px}
.cnc-root.proj .dro .v{font-size:21px}
.cnc-root.proj .dro .g.pos .v{font-size:28px}
.cnc-root.proj .dro .g.cond .v{font-size:18px}
.cnc-root.proj .legend{font-size:14px;gap:18px}
.cnc-root.proj .legend i{width:22px;border-top-width:3px}
.cnc-root.proj .stats .k{font-size:11.5px}
.cnc-root.proj .stats .v{font-size:18px}
.cnc-root.proj .stats .hint{font-size:14px}
.cnc-root.proj .legend{display:none}
.cnc-root.proj .tabs button{font-size:12.5px}
@media (max-width:880px){
  .main{flex-direction:column}
  .split{display:none}
  .left{width:auto!important;height:52%;border-bottom:1px solid var(--line)}
  .pane{height:150px}
  .stats{display:none}
}

<h1>CNC ISO simul\xE1tor</h1><p class="sub">U\u017Eivatelsk\xE1 p\u0159\xEDru\u010Dka</p>

<div class="intro">
<p>Simul\xE1tor slou\u017E\xED k psan\xED a odzkou\u0161en\xED program\u016F v ISO k\xF3du d\u0159\xEDv, ne\u017E se pust\xED na stroj. Vlevo se program p\xED\u0161e, vpravo se rovnou kresl\xED dr\xE1ha n\xE1stroje na polotovaru. Program b\u011B\u017E\xED v prohl\xED\u017Ee\u010Di, nic se neinstaluje a nikam se nic neodes\xEDl\xE1.</p>
<p>Fr\xE9zuje se v rovin\u011B XY. V\xFDchoz\xED pohled je p\u016Fdorys, tak jak se obrys kresl\xED na v\xFDkrese; tla\u010D\xEDtkem 3D se d\xE1 p\u0159epnout na \u0161ikm\xFD pohled, kde je vid\u011Bt i hloubka.</p>
<p>V\u0161echny rozm\u011Bry jsou v milimetrech. Palce simul\xE1tor nezn\xE1 a G21 se nemus\xED programovat.</p>
</div>
<h2 id="k1">1 \xB7 Rozvr\u017Een\xED obrazovky</h2>
<p>Obrazovka m\xE1 t\u0159i \u010D\xE1sti. Naho\u0159e je li\u0161ta p\u0159ehr\xE1v\xE1n\xED, vlevo editor programu se z\xE1lo\u017Ekami, vpravo plocha s polotovarem.</p>
<table><thead><tr><th>\u010C\xE1st</th><th>K \u010Demu je</th></tr></thead><tbody>
<tr><td class="mono">Z\xE1hlav\xED</td><td>N\xE1zev pr\xE1v\u011B otev\u0159en\xE9ho programu. Hv\u011Bzdi\u010Dka za n\xE1zvem znamen\xE1 neulo\u017Een\xE9 zm\u011Bny.</td></tr>
<tr><td class="mono">Horn\xED li\u0161ta</td><td>Vlevo ovl\xE1d\xE1n\xED simulace (Simulace, Blok, Na za\u010D\xE1tek, posuvn\xEDk, rychlost 1\xD7 a\u017E 40\xD7), vpravo za d\u011Blic\xED \u010D\xE1rou n\xE1stroje pohledu (M\u011B\u0159en\xED, 3D, P\u0159izp\u016Fsobit, Projektor).</td></tr>
<tr><td class="mono">Li\u0161ta soubor\u016F</td><td>Prvn\xED \u0159\xE1dek Nov\xFD, Otev\u0159\xEDt, Ulo\u017Eit, Ulo\u017Eit jako a Uk\xE1zky. Druh\xFD \u0159\xE1dek s popiskem Bloky: p\u0159ep\xEDna\u010D N+10, P\u0159e\u010D\xEDslovat a tla\u010D\xEDtka Krok zp\u011Bt a Znovu.</td></tr>
<tr><td class="mono">Editor</td><td>Vlastn\xED program. Vlevo jsou \u010D\xEDsla \u0159\xE1dk\u016F, chybn\xE9 \u0159\xE1dky se v tomto sloupci zna\u010D\xED barevn\u011B.</td></tr>
<tr><td class="mono">Z\xE1lo\u017Eky</td><td>Polotovar, Z\xE1sobn\xEDk n\xE1stroj\u016F a Kontrola s hl\xE1\u0161en\xEDm chyb.</td></tr>
<tr><td class="mono">Plocha</td><td>Polotovar, dr\xE1ha n\xE1stroje, odebran\xFD materi\xE1l, d\xEDry, zna\u010Dka nulov\xE9ho bodu, m\u011B\u0159\xEDtko osy Z a odm\u011B\u0159ov\xE1n\xED.</td></tr>
</tbody></table>
<h2 id="k2">2 \xB7 Prvn\xED program krok za krokem</h2>
<p>Nejrychlej\u0161\xED cesta k pochopen\xED je otev\u0159\xEDt n\u011Bkterou uk\xE1zku a nechat ji projet. V li\u0161t\u011B soubor\u016F rozbal nab\xEDdku Uk\xE1zky a vyber Obrys s korekc\xED G41.</p>
<ol><li>Zkontroluj v z\xE1lo\u017Ece Polotovar rozm\u011Bry a um\xEDst\u011Bn\xED nuly.</li><li>V z\xE1lo\u017Ece Z\xE1sobn\xEDk se pod\xEDvej, jak\xE9 n\xE1stroje jsou v jednotliv\xFDch m\xEDstech.</li><li>Stiskni Simulace. N\xE1stroj se rozjede po dr\xE1ze a za sebou nech\xE1v\xE1 odebran\xFD materi\xE1l. T\xEDmt\xE9\u017E tla\u010D\xEDtkem se b\u011Bh pozastav\xED.</li><li>Tla\u010D\xEDtkem Blok se posune\u0161 v\u017Edy o jeden blok \u2014 hod\xED se, kdy\u017E je pot\u0159eba uk\xE1zat, co kter\xFD \u0159\xE1dek d\u011Bl\xE1.</li><li>Posuvn\xEDkem v horn\xED li\u0161t\u011B se d\xE1 v programu libovoln\u011B p\u0159ej\xED\u017Ed\u011Bt tam i zp\u011Bt.</li></ol>
<p>B\u011Bhem simulace se aktivn\xED \u0159\xE1dek v editoru podbarvuje, tak\u017Ee je po\u0159\xE1d vid\u011Bt, kter\xFD blok se pr\xE1v\u011B prov\xE1d\xED.</p>
<h2 id="k3">3 \xB7 Polotovar a nulov\xFD bod</h2>
<p>V z\xE1lo\u017Ece Polotovar se zadaj\xED rozm\u011Bry X, Y a Z a ur\u010D\xED se, kde na polotovaru le\u017E\xED nulov\xFD bod G54.</p>
<table><thead><tr><th>Um\xEDst\u011Bn\xED nuly</th><th>Co to znamen\xE1</th></tr></thead><tbody>
<tr><td class="mono">Lev\xFD spodn\xED roh</td><td>Nejb\u011B\u017En\u011Bj\u0161\xED volba. Polotovar le\u017E\xED cel\xFD v kladn\xFDch sou\u0159adnic\xEDch.</td></tr>
<tr><td class="mono">Lev\xFD horn\xED roh</td><td>Sou\u0159adnice Y vych\xE1zej\xED z\xE1porn\u011B.</td></tr>
<tr><td class="mono">Prav\xFD spodn\xED roh</td><td>Sou\u0159adnice X vych\xE1zej\xED z\xE1porn\u011B.</td></tr>
<tr><td class="mono">Prav\xFD horn\xED roh</td><td>Z\xE1porn\xE9 jsou X i Y.</td></tr>
<tr><td class="mono">St\u0159ed polotovaru</td><td>Vhodn\xE9 pro soum\u011Brn\xE9 sou\u010D\xE1sti.</td></tr>
<tr><td class="mono">Vlastn\xED hranice</td><td>\u0160est pol\xED, kter\xFDmi se hranice zadaj\xED p\u0159\xEDmo. Pro nepravideln\xE9 upnut\xED.</td></tr>
</tbody></table>
<p>V ose Z se zvl\xE1\u0161\u0165 vol\xED, jestli je nula na horn\xED plo\u0161e (materi\xE1l je pak v m\xEDnusu, co\u017E je obvykl\xE9) nebo na doln\xED.</p>
<p>Nula z\u016Fst\xE1v\xE1 na zvolen\xE9m rohu i po zm\u011Bn\u011B rozm\u011Br\u016F. Pod poli se pr\u016Fb\u011B\u017En\u011B vypisuj\xED skute\u010Dn\xE9 hranice polotovaru, tak\u017Ee je vid\u011Bt, v jak\xE9m rozsahu se m\xE1 program pohybovat.</p>
<p>Nastaven\xED polotovaru i z\xE1sobn\xEDku se ukl\xE1d\xE1 p\u0159\xEDmo do NC souboru jako koment\xE1\u0159 na za\u010D\xE1tku. P\u0159i dal\u0161\xEDm otev\u0159en\xED se samo obnov\xED a v editoru p\u0159itom nen\xED vid\u011Bt.</p>
<p>Za n\xE1zvem z\xE1lo\u017Eky je mal\xE9 \u017Elut\xE9 \u201Ei\u201C. Kliknut\xEDm se naho\u0159e v panelu rozbal\xED vysv\u011Btluj\xEDc\xED pozn\xE1mka, dal\u0161\xEDm kliknut\xEDm se zase schov\xE1.</p>
<h2 id="k4">4 \xB7 Z\xE1sobn\xEDk n\xE1stroj\u016F</h2>
<p>Z\xE1sobn\xEDk m\xE1 p\u011Bt m\xEDst. U ka\u017Ed\xE9ho se vol\xED typ (fr\xE9za nebo vrt\xE1k), pr\u016Fm\u011Br a po\u010Det zub\u016F.</p>
<table><thead><tr><th>\xDAdaj</th><th>K \u010Demu slou\u017E\xED</th></tr></thead><tbody>
<tr><td class="mono">Typ</td><td>Fr\xE9za kresl\xED \u0161\xED\u0159ku z\xE1b\u011Bru a sm\xED pou\u017E\xEDvat korekci r\xE1diusu. Vrt\xE1k d\u011Bl\xE1 d\xEDry a v materi\xE1lu se nesm\xED posouvat do stran.</td></tr>
<tr><td class="mono">Pr\u016Fm\u011Br</td><td>U fr\xE9zy ur\u010Duje r\xE1dius korekce i \u0161\xED\u0159ku odebran\xE9ho p\xE1su, u vrt\xE1ku pr\u016Fm\u011Br d\xEDry.</td></tr>
<tr><td class="mono">Po\u010Det zub\u016F</td><td>Jen pro v\xFDpo\u010Det posuvu na zub. Na dr\xE1hu nem\xE1 vliv.</td></tr>
</tbody></table>
<p>D\xE9lka n\xE1stroje se nikde nezad\xE1v\xE1. Ve \u0161kole ji dr\u017E\xED korekce stroje, do programu nepat\u0159\xED, a proto simul\xE1tor G43, G44 ani G49 nep\u0159ij\xEDm\xE1.</p>
<p>P\u0159ed spu\u0161t\u011Bn\xEDm programu stoj\xED n\xE1stroj v ose nulov\xE9ho bodu, ale 100 mm nad horn\xED plochou polotovaru. V nule obrobku by fyzicky v\u011Bzel v materi\xE1lu a ne\u0161lo by ani upnout. \u017D\xE1dn\xFD bod v\xFDm\u011Bny simul\xE1tor nep\u0159edpokl\xE1d\xE1 \u2014 naj\xED\u017Ed\xED se na n\u011Bj v programu.</p>
<p>Ne\u017E program zavol\xE1 v\xFDm\u011Bnu, je v\u0159eteno pr\xE1zdn\xE9. Sou\u0159adnice se sleduj\xED, ale nic se neobr\xE1b\xED \u2014 m\xEDsto kole\u010Dka n\xE1stroje se kresl\xED jen \u0161ed\xFD k\u0159\xED\u017Eek. Je to schv\xE1ln\u011B: kdyby simul\xE1tor p\u0159edpokl\xE1dal upnut\xFD prvn\xED n\xE1stroj, nikdo by si nev\u0161iml, \u017Ee v programu chyb\xED v\xFDm\u011Bna.</p>
<p>V\xFDm\u011Bna se zapisuje jako T2 M6. Na po\u0159ad\xED slov nez\xE1le\u017E\xED. V\xFDm\u011Bna zastav\xED v\u0159eteno, tak\u017Ee po n\xED mus\xED n\xE1sledovat nov\xE9 spu\u0161t\u011Bn\xED ot\xE1\u010Dek \u2014 p\u0159esn\u011B jako na stroji.</p>
<p>Ka\u017Ed\xE9 m\xEDsto v z\xE1sobn\xEDku m\xE1 vlastn\xED barvu a tou se kresl\xED i jeho dr\xE1ha. V programu s v\xEDce n\xE1stroji je tak na prvn\xED pohled vid\u011Bt, kter\xE1 \u010D\xE1st pat\u0159\xED kter\xE9mu n\xE1stroji.</p>
<h2 id="k5">5 \xB7 Co simul\xE1tor z ISO k\xF3du rozum\xED</h2>
<p>Podporovan\xE9 je to, co se b\u011B\u017En\u011B pou\u017E\xEDv\xE1 p\u0159i v\xFDuce fr\xE9zov\xE1n\xED ve dvou os\xE1ch.</p>
<table><thead><tr><th>K\xF3d</th><th>V\xFDznam</th></tr></thead><tbody>
<tr><td class="mono">G0</td><td>Rychloposuv. Kresl\xED se oran\u017Eov\u011B \u010D\xE1rkovan\u011B.</td></tr>
<tr><td class="mono">G1</td><td>P\u0159\xEDm\xFD pracovn\xED posuv.</td></tr>
<tr><td class="mono">G2, G3</td><td>Oblouk po sm\u011Bru a proti sm\u011Bru hodinov\xFDch ru\u010Di\u010Dek. Zad\xE1v\xE1 se p\u0159es I a J nebo p\u0159es R. Pln\xFD kruh jde jen p\u0159es I a J.</td></tr>
<tr><td class="mono">G10 a\u017E G13</td><td>Pol\xE1rn\xED sou\u0159adnice. P\xF3l se zad\xE1 slovy I a J, poloha pak slovy R (polom\u011Br) a A (\xFAhel). \xDAhel A se mus\xED napsat v ka\u017Ed\xE9m pol\xE1rn\xEDm bloku.</td></tr>
<tr><td class="mono">A</td><td>\xDAhel p\u0159\xEDmky v bloku G1. M\u011B\u0159\xED se od kladn\xE9 osy X proti sm\u011Bru hodinov\xFDch ru\u010Di\u010Dek. Zad\xE1 se jedna sou\u0159adnice koncov\xE9ho bodu a druh\xE1 se dopo\u010D\xEDt\xE1.</td></tr>
<tr><td class="mono">G17</td><td>Rovina XY. Simul\xE1tor jinou rovinu nezn\xE1, tak\u017Ee se G17 nemus\xED programovat; kdy\u017E ho nap\xED\u0161e\u0161, p\u0159ijme se.</td></tr>
<tr><td class="mono">G40, G41, G42</td><td>Zru\u0161en\xED korekce, korekce vlevo a vpravo od obrysu.</td></tr>
<tr><td class="mono">G54</td><td>Nulov\xFD bod. Jin\xE9 posunut\xED G55 a\u017E G59 simul\xE1tor hl\xE1s\xED jako chybu.</td></tr>
<tr><td class="mono">G81, G83</td><td>Vrtac\xED cyklus jednoduch\xFD a s v\xFDplachem. G80 cyklus zru\u0161\xED, G98 a G99 vol\xED n\xE1vratovou rovinu.</td></tr>
<tr><td class="mono">G90, G91</td><td>Absolutn\xED a p\u0159\xEDr\u016Fstkov\xE9 zad\xE1v\xE1n\xED.</td></tr>
<tr><td class="mono">G247, G248</td><td>N\xE1jezd a odjezd obloukem.</td></tr>
<tr><td class="mono">M3, M4, M5</td><td>Ot\xE1\u010Dky vpravo, vlevo a zastaven\xED v\u0159etena.</td></tr>
<tr><td class="mono">M6</td><td>V\xFDm\u011Bna n\xE1stroje.</td></tr>
<tr><td class="mono">M7, M8, M9</td><td>Zapnut\xED a vypnut\xED chlazen\xED.</td></tr>
<tr><td class="mono">M98, M99</td><td>Vol\xE1n\xED a konec podprogramu.</td></tr>
<tr><td class="mono">M30</td><td>Konec programu.</td></tr>
<tr><td class="mono">B na konci bloku</td><td>Roh v naprogramovan\xE9m vrcholu. Kladn\xE1 hodnota je zaoblen\xED (B8 = R8), z\xE1porn\xE1 sra\u017Een\xED, jeho\u017E hodnota je d\xE9lka odv\u011Bsny (B-5 = odebere 5 mm po ka\u017Ed\xE9 stran\u011B).</td></tr>
<tr><td class="mono">S, F, T</td><td>Ot\xE1\u010Dky, posuv a \u010D\xEDslo n\xE1stroje. Plat\xED mod\xE1ln\u011B.</td></tr>
</tbody></table>
<p>Koment\xE1\u0159e se p\xED\u0161\xED v\xFDhradn\u011B do kulat\xFDch z\xE1vorek. St\u0159edn\xEDk simul\xE1tor odm\xEDt\xE1, proto\u017Ee v ISO k\xF3du nem\xE1 co d\u011Blat.</p>
<p>V pol\xE1rn\xEDm re\u017Eimu se \xFAhel A p\xED\u0161e v ka\u017Ed\xE9m bloku, i kdy\u017E se nem\u011Bn\xED. D\u0159\xEDv\u011Bj\u0161\xED \u0159\xEDzen\xED n\u011Bkdy dopl\u0148ovala posledn\xED hodnotu samo, co\u017E vedlo k t\u011B\u017Eko hledan\xFDm chyb\xE1m \u2014 simul\xE1tor proto chyb\u011Bj\xEDc\xED \xFAhel ohl\xE1s\xED. Star\u0161\xED z\xE1pis se slovem H se d\xE1l p\u0159ij\xEDm\xE1, aby \u0161ly otev\u0159\xEDt d\u0159\xEDve napsan\xE9 programy.</p>
<p>Roh se zad\xE1v\xE1 jedin\xFDm slovem B na konci bloku a rozhoduje znam\xE9nko: B8 je zaoblen\xED o polom\u011Bru 8 mm, B-5 sra\u017Een\xED, kter\xE9 ubere 5 mm po ka\u017Ed\xE9 stran\u011B vrcholu. D\u0159\xEDv\u011Bj\u0161\xED z\xE1pis C pro sra\u017Een\xED a R pro zaoblen\xED se d\xE1l p\u0159ij\xEDm\xE1.</p>
<p>P\u0159\xEDmku lze zadat i \xFAhlem: v bloku G1 se nap\xED\u0161e jedna sou\u0159adnice koncov\xE9ho bodu a slovo A. Nap\u0159\xEDklad G1 X50 A30 dojede na X50 po p\u0159\xEDmce sv\xEDraj\xEDc\xED s osou X \xFAhel 30\xB0, sou\u0159adnice Y se dopo\u010D\xEDt\xE1. Stejn\u011B tak G1 Y40 A60 dopo\u010D\xEDt\xE1 X. Ob\u011B sou\u0159adnice z\xE1rove\u0148 s \xFAhlem zadat nelze, koncov\xFD bod by byl ur\u010Den\xFD dvakr\xE1t.</p>
<h2 id="k6">6 \xB7 Korekce r\xE1diusu</h2>
<p>Korekce je hlavn\xED d\u016Fvod, pro\u010D simul\xE1tor vznikl. Programuje se obrys sou\u010D\xE1sti, ale n\xE1stroj mus\xED jet o sv\u016Fj r\xE1dius vedle. Simul\xE1tor kresl\xED oboj\xED najednou:</p>
<ul><li>Barevn\u011B dr\xE1hu, po kter\xE9 se skute\u010Dn\u011B pohybuje st\u0159ed n\xE1stroje.</li><li>\u0160ed\u011B \u010D\xE1rkovan\u011B obrys, kter\xFD je v programu napsan\xFD.</li></ul>
<p>Blok s G41 nebo G42 dojede na za\u010D\xE1tek korigovan\xE9 dr\xE1hy, blok s G40 se z n\xED vrac\xED \u2014 stejn\u011B jako na stroji. Vn\u011Bj\u0161\xED rohy n\xE1stroj obj\xED\u017Ed\xED obloukem, vnit\u0159n\xED se \u0159e\u0161\xED pr\u016Fse\u010D\xEDkem.</p>
<p>Kdy\u017E se n\xE1stroj do tvaru nevejde, simul\xE1tor to pozn\xE1 a ohl\xE1s\xED. Typicky se to stane u vnit\u0159n\xEDho rohu men\u0161\xEDho, ne\u017E je r\xE1dius fr\xE9zy, nebo u \xFAzk\xE9 dr\xE1\u017Eky.</p>
<p>Pro vnit\u0159n\xED rohy plat\xED jednoduch\xE9 pravidlo: r\xE1dius fr\xE9zy mus\xED b\xFDt nejv\xFD\u0161 takov\xFD, jako je r\xE1dius rohu. Fr\xE9za \xD810 ud\u011Bl\xE1 roh R5 p\u0159esn\u011B \u2014 jen se v n\u011Bm ost\u0159e zm\u011Bn\xED sm\u011Br pohybu. Fr\xE9za \xD812 u\u017E roh R5 neud\u011Bl\xE1, vyjde z n\xED R6 a st\u011Bna se v kout\u011B pod\u0159\xEDzne; simul\xE1tor to ohl\xE1s\xED a z\xE1rove\u0148 nakresl\xED, jak by to na stroji dopadlo.</p>
<p>Sousledn\xE9 fr\xE9zov\xE1n\xED se pozn\xE1 z kombinace korekce a smyslu ot\xE1\u010Den\xED: k G41 pat\u0159\xED M3, ke G42 M4. V odm\u011B\u0159ov\xE1n\xED je vid\u011Bt, jestli se pr\xE1v\u011B fr\xE9zuje sousledn\u011B, nebo nesousledn\u011B.</p>
<h2 id="k7">7 \xB7 Vrtac\xED cykly</h2>
<p>M\xEDsto opakovan\xE9ho zaj\xED\u017Ed\u011Bn\xED a vyj\xED\u017Ed\u011Bn\xED se d\xE1 pou\u017E\xEDt cyklus.</p>
<table><thead><tr><th>Z\xE1pis</th><th>Chov\xE1n\xED</th></tr></thead><tbody>
<tr><td class="mono">G81 X.. Y.. Z.. R.. F..</td><td>Najet\xED nad d\xEDru, rychloposuv na rovinu R, posuvem na dno Z a n\xE1vrat.</td></tr>
<tr><td class="mono">G83 \u2026 Q..</td><td>Tot\xE9\u017E, ale po z\xE1b\u011Brech Q. Po ka\u017Ed\xE9m z\xE1b\u011Bru n\xE1stroj vyjede a\u017E na rovinu R kv\u016Fli odvodu t\u0159\xEDsky a pak se vr\xE1t\xED zp\u011Bt.</td></tr>
<tr><td class="mono">G98 / G99</td><td>N\xE1vrat na v\xFDchoz\xED v\xFD\u0161ku, nebo jen na rovinu R. P\u0159epnout se d\xE1 i uprost\u0159ed s\xE9rie d\u011Br.</td></tr>
<tr><td class="mono">G80</td><td>Zru\u0161en\xED cyklu.</td></tr>
<tr><td class="mono">L</td><td>Po\u010Det opakov\xE1n\xED. V p\u0159\xEDr\u016Fstkov\xE9m re\u017Eimu ud\u011Bl\xE1 \u0159adu d\u011Br.</td></tr>
</tbody></table>
<p>Cyklus je mod\xE1ln\xED. Blok, ve kter\xE9m se zad\xE1, se provede rovnou; ka\u017Ed\xFD dal\u0161\xED blok se sou\u0159adnicemi X a Y vyvrt\xE1 dal\u0161\xED d\xEDru. Zru\u0161\xED ho G80 nebo kter\xFDkoli pohybov\xFD k\xF3d.</p>
<p>Po zru\u0161en\xED cyklu je pot\u0159eba znovu napsat G0 nebo G1. Simul\xE1tor to vy\u017Eaduje schv\xE1ln\u011B, aby bylo z programu jasn\xE9, jak\xFD pohyb n\xE1sleduje.</p>
<h2 id="k8">8 \xB7 Podprogramy</h2>
<p>Opakuj\xEDc\xED se \u010D\xE1sti se daj\xED vy\u010Dlenit do podprogramu. \u0158\xE1dek s O a \u010D\xEDslem podprogram otev\xEDr\xE1, M99 ho uzav\xEDr\xE1, vol\xE1 se pomoc\xED M98 P s \u010D\xEDslem podprogramu. P\u0159id\xE1n\xEDm L se vol\xE1n\xED zopakuje.</p>
<p>Podprogram se p\xED\u0161e a\u017E za koncem hlavn\xEDho programu, tedy za M30. Pokud na to n\u011Bkdo zapomene, simul\xE1tor upozorn\xED.</p>
<h2 id="k9">9 \xB7 Kontrola programu</h2>
<p>Simul\xE1tor program pr\u016Fb\u011B\u017En\u011B kontroluje. U z\xE1lo\u017Eky Kontrola sv\xEDt\xED te\u010Dka, kter\xE1 napov\xED, jak na tom program je:</p>
<table><thead><tr><th>Te\u010Dka</th><th>V\xFDznam</th></tr></thead><tbody>
<tr><td class="mono">Zelen\xE1</td><td>Bez chyb. Mohou b\xFDt pozn\xE1mky, ale nic, co by vadilo.</td></tr>
<tr><td class="mono">Oran\u017Eov\xE1</td><td>Varov\xE1n\xED. Program by prob\u011Bhl, ale n\u011Bco nen\xED v po\u0159\xE1dku.</td></tr>
<tr><td class="mono">\u010Cerven\xE1</td><td>Chyba. Takhle by program na stroji neprob\u011Bhl nebo by dopadl \u0161patn\u011B.</td></tr>
</tbody></table>
<p>Hl\xE1\u0161ky se odkazuj\xED na \u010D\xEDslo bloku N, ne na po\u0159ad\xED \u0159\xE1dku \u2014 stejn\u011B jako chybov\xE1 hl\xE1\u0161en\xED na stroji.</p>
<p>Mezi nej\u010Dast\u011Bj\u0161\xED pat\u0159\xED:</p>
<ul><li>V\u0159eteno se neto\u010D\xED, p\u0159ed z\xE1b\u011Brem chyb\xED M3 nebo M4.</li><li>Pohyb v materi\xE1lu bez upnut\xE9ho n\xE1stroje, chyb\xED v\xFDm\u011Bna T a M6.</li><li>Rychloposuv G0 v materi\xE1lu; do z\xE1b\u011Bru se naj\xED\u017Ed\xED posuvem G1.</li><li>N\xE1stroj se do obrysu nevejde, korigovan\xE1 dr\xE1ha do n\u011Bj zaj\xED\u017Ed\xED.</li><li>Vrt\xE1k se posouv\xE1 do stran pod povrchem polotovaru.</li><li>\u017D\xE1dn\xFD posuv nezasahuje do polotovaru \u2014 obvykle je \u0161patn\u011B nulov\xFD bod nebo rozm\u011Bry.</li><li>Chyb\xED posuv F; simul\xE1tor pak po\u010D\xEDt\xE1 se 100 mm/min.</li><li>\u0158ezn\xE1 rychlost nebo posuv na zub jsou mimo rozumn\xE9 meze.</li><li>Koment\xE1\u0159 mimo z\xE1vorku nebo neuzav\u0159en\xE1 z\xE1vorka.</li></ul>
<p>Rozepsan\xFD \u0159\xE1dek se nekontroluje, dokud z n\u011Bj kurzor neodejde. B\u011Bhem psan\xED tedy nikdo nedost\xE1v\xE1 chyby na p\u016Flku bloku.</p>
<h2 id="k10">10 \xB7 Editor</h2>
<p>Editor je uzp\u016Fsoben\xFD psan\xED NC program\u016F.</p>
<ul><li>Enter zalo\u017E\xED nov\xFD \u0159\xE1dek a rovnou mu d\xE1 \u010D\xEDslo o deset vy\u0161\u0161\xED. Kdy\u017E se vkl\xE1d\xE1 doprost\u0159ed programu, \u010D\xEDslo se zvol\xED tak, aby dr\u017Eelo po\u0159ad\xED. P\u0159ep\xEDna\u010D N+10 tuto pomoc vyp\xEDn\xE1, Shift a Enter ud\u011Bl\xE1 hol\xFD \u0159\xE1dek.</li><li>Tla\u010D\xEDtko P\u0159e\u010D\xEDslovat srovn\xE1 \u010D\xEDsla blok\u016F od za\u010D\xE1tku. Pr\xE1zdn\xE9 \u0159\xE1dky a samostatn\xE9 koment\xE1\u0159e z\u016Fstanou bez \u010D\xEDsla.</li><li>Mal\xE1 p\xEDsmena se p\u0159episuj\xED na velk\xE1, obsah z\xE1vorek z\u016Fst\xE1v\xE1, jak byl naps\xE1n.</li><li>Barvy odpov\xEDdaj\xED legend\u011B pod plochou: rychloposuv oran\u017Eov\u011B, pracovn\xED posuv tyrkysov\u011B, ostatn\xED G modro\u0161ed\u011B, slova M, T a S \u017Elut\u011B.</li><li>Velikost p\xEDsma se m\u011Bn\xED podr\u017Een\xEDm Ctrl a ot\xE1\u010Den\xEDm kole\u010Dka my\u0161i nad editorem, v rozmez\xED 10 a\u017E 30 bod\u016F. Hod\xED se p\u0159i v\xFDkladu u projektoru.</li><li>Krok zp\u011Bt a Znovu jsou i jako tla\u010D\xEDtka v \u0159\xE1dku BLOKY. Za\u0161ednou, kdy\u017E v historii nen\xED kam j\xEDt.</li></ul>
<table><thead><tr><th>Kl\xE1vesa</th><th>Funkce</th></tr></thead><tbody>
<tr><td class="mono">Ctrl + Z</td><td>Krok zp\u011Bt</td></tr>
<tr><td class="mono">Ctrl + Y nebo Ctrl + Shift + Z</td><td>Krok vp\u0159ed</td></tr>

<tr><td class="mono">Ctrl + O</td><td>Otev\u0159\xEDt</td></tr>
<tr><td class="mono">Ctrl + kole\u010Dko my\u0161i</td><td>Velikost p\xEDsma editoru</td></tr>

<h2 id="k11">11 \xB7 Plocha a odm\u011B\u0159ov\xE1n\xED</h2>
<p>Kole\u010Dkem my\u0161i se p\u0159ibli\u017Euje a oddaluje, ta\u017Een\xEDm se plocha posouv\xE1. Tla\u010D\xEDtko P\u0159izp\u016Fsobit d\xE1 polotovar doprost\u0159ed plochy a zvol\xED m\u011B\u0159\xEDtko tak, aby se ve\u0161la cel\xE1 dr\xE1ha.</p>
<table><thead><tr><th>Co je vid\u011Bt</th><th>V\xFDznam</th></tr></thead><tbody>
<tr><td class="mono">Oran\u017Eov\xE1 \u010D\xE1rkovan\xE1</td><td>Rychloposuv G0.</td></tr>
<tr><td class="mono">Barevn\xE1 pln\xE1</td><td>Pracovn\xED posuv v materi\xE1lu, barva podle m\xEDsta v z\xE1sobn\xEDku.</td></tr>
<tr><td class="mono">Barevn\xE1 sv\u011Btlej\u0161\xED</td><td>Pracovn\xED posuv mimo materi\xE1l.</td></tr>
<tr><td class="mono">\u0160ed\xE1 \u010D\xE1rkovan\xE1</td><td>Obrys tak, jak je napsan\xFD v programu, kdy\u017E je zapnut\xE1 korekce.</td></tr>
<tr><td class="mono">Tmav\xFD p\xE1s za n\xE1strojem</td><td>Odebran\xFD materi\xE1l v \u0161\xED\u0159ce n\xE1stroje.</td></tr>
<tr><td class="mono">Zna\u010Dka W</td><td>Nulov\xFD bod G54.</td></tr>
<tr><td class="mono">Sloupec vpravo</td><td>M\u011B\u0159\xEDtko osy Z s aktu\xE1ln\xED hloubkou.</td></tr>
</tbody></table>
<p>Tla\u010D\xEDtko 3D p\u0159epne z p\u016Fdorysu do \u0161ikm\xE9ho pohledu, kde polotovar vypad\xE1 jako kv\xE1dr a dr\xE1ha je nakreslen\xE1 ve sv\xE9 skute\u010Dn\xE9 v\xFD\u0161ce. Teprve tady je vid\u011Bt, jak n\xE1stroj sj\xED\u017Ed\xED do materi\xE1lu a jak vysoko p\u0159ej\xED\u017Ed\xED mezi obrysy \u2014 v p\u016Fdorysu je pohyb pouze v ose Z jen zm\u011Bna \u010D\xEDsla. Dob\u0159e se tak ukazuje bezpe\u010Dn\xE1 v\xFD\u0161ka, hloubka z\xE1b\u011Bru i jednotliv\xE9 z\xE1b\u011Bry cyklu G83. Tla\u010D\xEDtko se p\u0159itom p\u0159ejmenuje na P\u016Fdorys a jeho stiskem se vr\xE1t\xED p\u016Fvodn\xED pohled. Roh polotovaru X0 Y0 z\u016Fst\xE1v\xE1 vlevo vep\u0159edu, tak\u017Ee se snadno pozn\xE1, kde je nulov\xFD bod.</p>
<p>Ve 3D se nekresl\xED odebran\xFD materi\xE1l a nelze m\u011B\u0159it; na oboj\xED slou\u017E\xED p\u016Fdorys. Zbytek funguje stejn\u011B: kole\u010Dko p\u0159ibli\u017Euje, ta\u017Een\xEDm se pohled posouv\xE1, P\u0159izp\u016Fsobit srovn\xE1 v\xFD\u0159ez.</p>
<p>Dole je odm\u011B\u0159ov\xE1n\xED: sou\u0159adnice X, Y a Z, ot\xE1\u010Dky a smysl v\u0159etena, upnut\xFD n\xE1stroj, stav korekce, \u0159ezn\xE1 rychlost, posuv na zub, sousledn\xE9 \u010Di nesousledn\xE9 fr\xE9zov\xE1n\xED a \u010D\xEDslo pr\xE1v\u011B prov\xE1d\u011Bn\xE9ho bloku.</p>
<p>Vpravo naho\u0159e je celkov\xE1 dr\xE1ha, d\xE9lka v \u0159ezu a odhad \u010Dasu.</p>
<p>Odm\u011B\u0159ov\xE1n\xED i legendu lze sbalit kole\u010Dkem se znam\xE9nkem minus v jejich rohu; z\u016Fstane po nich jen mal\xE1 pilulka, kterou se zase rozbal\xED. Na men\u0161\xED obrazovce tak zbude v\xEDc m\xEDsta na polotovar.</p>
<p>Tla\u010D\xEDtko M\u011B\u0159en\xED zapne prav\xEDtko. Po dvou kliknut\xEDch do plochy se uk\xE1\u017Ee vzd\xE1lenost, p\u0159\xEDr\u016Fstky v X a Y a \xFAhel. Body se p\u0159ichyt\xE1vaj\xED k dr\xE1ze, tak\u017Ee se m\u011B\u0159\xED skute\u010Dn\xE9 rozm\u011Bry, ne odhad podle oka. M\u011B\u0159en\xED se ukon\u010D\xED stejn\xFDm tla\u010D\xEDtkem.</p>
<h2 id="k12">12 \xB7 P\u0159izp\u016Fsoben\xED pracovn\xED plochy</h2>
<p>Simul\xE1tor se d\xE1 p\u0159izp\u016Fsobit u\u010Debn\u011B i projektoru.</p>
<ul><li>\u0160\xED\u0159ka lev\xE9ho panelu se m\u011Bn\xED ta\u017Een\xEDm za svislou p\u0159\xED\u010Dku mezi editorem a plochou. Dvojklik na p\u0159\xED\u010Dku vr\xE1t\xED v\xFDchoz\xED \u0161\xED\u0159ku. Plo\u0161e v\u017Edy z\u016Fstane alespo\u0148 kousek m\xEDsta, panel nejde z\xFA\u017Eit pod \u010Ditelnou m\xEDru.</li><li>Tla\u010D\xEDtko Projektor v prav\xE9 \u010D\xE1sti horn\xED li\u0161ty zv\u011Bt\u0161\xED najednou p\xEDsmo editoru, odm\u011B\u0159ov\xE1n\xED i z\xE1lo\u017Eky a roz\u0161\xED\u0159\xED lev\xFD panel. Legenda se skryje, aby nep\u0159ek\xE1\u017Eela. Dal\u0161\xEDm stiskem se v\u0161e vr\xE1t\xED do p\u016Fvodn\xEDho stavu.</li></ul>
<p>Velikost p\xEDsma, \u0161\xED\u0159ka panelu i re\u017Eim Projektor se pamatuj\xED, tak\u017Ee po zav\u0159en\xED a otev\u0159en\xED z\u016Fstane nastaven\xED zachovan\xE9. V n\u011Bkter\xFDch prost\u0159ed\xEDch, nap\u0159\xEDklad v n\xE1hledu uvnit\u0159 Claude, prohl\xED\u017Ee\u010D ukl\xE1d\xE1n\xED nedovol\xED \u2014 pak nastaven\xED plat\xED jen do zav\u0159en\xED str\xE1nky. Na chod simul\xE1toru to nem\xE1 vliv.</p>
<h2 id="k13">13 \xB7 Spu\u0161t\u011Bn\xED bez internetu</h2>
<p>Simul\xE1tor se dod\xE1v\xE1 jako jedin\xFD soubor CNC-simulator.html. Nic se neinstaluje a nic se nestahuje \u2014 cel\xFD program je uvnit\u0159 toho souboru.</p>
<ol><li>Zkop\xEDruj soubor CNC-simulator.html kamkoli na disk nebo na flash disk.</li><li>Poklepej na n\u011Bj. Otev\u0159e se ve v\xFDchoz\xEDm prohl\xED\u017Ee\u010Di a je p\u0159ipraven\xFD k pr\xE1ci.</li><li>Pokud se otev\u0159e v textov\xE9m editoru, klepni na soubor prav\xFDm tla\u010D\xEDtkem a zvol Otev\u0159\xEDt v programu, pak n\u011Bkter\xFD prohl\xED\u017Ee\u010D.</li></ol>
<p>Funguje v Chrome, Edge i Firefoxu, bez p\u0159ipojen\xED k s\xEDti. Na \u0161koln\xED po\u010D\xEDta\u010De sta\u010D\xED soubor zkop\xEDrovat, pr\xE1va spr\xE1vce nejsou pot\u0159eba.</p>
<p>Soubor s p\u0159\xEDponou .jsx, pokud jsi ho n\u011Bkde dostal, je zdrojov\xFD k\xF3d pro dal\u0161\xED v\xFDvoj. V prohl\xED\u017Ee\u010Di se zobraz\xED jen jako text \u2014 pro pr\xE1ci slou\u017E\xED verze .html.</p>
<p>Dv\u011B odchylky p\u0159i spu\u0161t\u011Bn\xED z disku: prohl\xED\u017Ee\u010D nemus\xED dovolit ulo\u017Eit nastaven\xED vzhledu, tak\u017Ee velikost p\xEDsma a \u0161\xED\u0159ka panelu plat\xED jen do zav\u0159en\xED okna. A Firefox neum\xED dialog s v\xFDb\u011Brem cesty, tak\u017Ee Ulo\u017Eit i Ulo\u017Eit jako odlo\u017E\xED program mezi sta\u017Een\xE9 soubory. Na samotn\xE9 programov\xE1n\xED to vliv nem\xE1.</p>
<h2 id="k14">14 \xB7 Pr\xE1ce se soubory</h2>
<p>Programy se ukl\xE1daj\xED jako b\u011B\u017En\xE9 textov\xE9 soubory s p\u0159\xEDponou .nc, .cnc, .iso, .tap, .gcode nebo .txt.</p>
<ul><li>Nov\xFD zalo\u017E\xED pr\xE1zdn\xFD program s jedin\xFDm \u0159\xE1dkem N10. \u017D\xE1dn\xE1 bezpe\u010Dnostn\xED hlavi\u010Dka se nedopl\u0148uje \u2014 posloupnost si mus\xED sestavit \u017E\xE1k s\xE1m.</li><li>Otev\u0159\xEDt a Ulo\u017Eit jako pou\u017E\xEDvaj\xED dialog s v\xFDb\u011Brem cesty. Kdy\u017E ho prohl\xED\u017Ee\u010D nepust\xED, ulo\u017E\xED se soubor mezi sta\u017Een\xE9.</li><li>Ulo\u017Eit p\u0159ep\xED\u0161e p\u016Fvodn\xED soubor, pokud byl otev\u0159en p\u0159es dialog.</li><li>Neulo\u017Een\xE9 zm\u011Bny zna\u010D\xED hv\u011Bzdi\u010Dka za n\xE1zvem programu v z\xE1hlav\xED. P\u0159ed nahrazen\xEDm obsahu se simul\xE1tor zept\xE1.</li></ul>
<p>Nastaven\xED polotovaru a z\xE1sobn\xEDku cestuje se souborem. Program otev\u0159en\xFD na jin\xE9m po\u010D\xEDta\u010Di se tedy chov\xE1 stejn\u011B.</p>
<h2 id="k15">15 \xB7 Doporu\u010Den\xE1 posloupnost programu</h2>
<p>Simul\xE1tor nevy\u017Eaduje pevn\xFD tvar programu, ale kontroly jsou nastaven\xE9 na obvyklou posloupnost. Vyplat\xED se ji dodr\u017Eet:</p>
<ol><li>\xDAvodn\xED blok se stavem: G90, G17, G40, G54.</li><li>V\xFDm\u011Bna n\xE1stroje: T a M6.</li><li>Ot\xE1\u010Dky a jejich spu\u0161t\u011Bn\xED: S a M3, p\u0159\xEDpadn\u011B chlazen\xED M8.</li><li>Odjezd do bezpe\u010Dn\xE9 v\xFD\u0161ky a najet\xED nad sou\u010D\xE1st rychloposuvem.</li><li>Sjezd na pracovn\xED hloubku posuvem G1.</li><li>Vlastn\xED obr\xE1b\u011Bn\xED, p\u0159\xEDpadn\u011B s korekc\xED G41 nebo G42.</li><li>Zru\u0161en\xED korekce G40, odjezd do bezpe\u010Dn\xE9 v\xFD\u0161ky.</li><li>Vypnut\xED chlazen\xED a konec programu M30.</li></ol>
<p>P\u0159ed ka\u017Edou v\xFDm\u011Bnou n\xE1stroje je pot\u0159eba odjet do bezpe\u010Dn\xE9 v\xFD\u0161ky. Simul\xE1tor to zat\xEDm nehl\xEDd\xE1, ale na stroji je to z\xE1sadn\xED.</p>
<h2 id="k16">16 \xB7 Co simul\xE1tor z\xE1m\u011Brn\u011B neum\xED</h2>
<p>N\u011Bkter\xE9 v\u011Bci chyb\xED schv\xE1ln\u011B, ne omylem:</p>
<ul><li>D\xE9lkovou korekci G43, G44 a G49 \u2014 d\xE9lku n\xE1stroje dr\u017E\xED korekce stroje.</li><li>Posunut\xED nulov\xE9ho bodu G55 a\u017E G59 \u2014 pracuje se s jednou upnutou sou\u010D\xE1st\xED.</li><li>Palcov\xE9 jednotky.</li><li>Koment\xE1\u0159e za st\u0159edn\xEDkem.</li><li>Odeb\xEDr\xE1n\xED materi\xE1lu po vrstv\xE1ch. Prostorov\xFD pohled ukazuje dr\xE1hu ve skute\u010Dn\xE9 v\xFD\u0161ce, ale odebran\xFD materi\xE1l se v n\u011Bm nekresl\xED \u2014 na to je p\u016Fdorys.</li></ul>
<footer>V\xFDukov\xE1 pom\u016Fcka pro CNC a CAM. Simul\xE1tor nenahrazuje ov\u011B\u0159en\xED programu na stroji.</footer>
