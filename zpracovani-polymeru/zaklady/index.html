<script type="text/x-dc" data-dc-script>
const CARDS = [

  { title: 'Identifikace plastů', desc: 'Rozlišení plastů zkouškou plamenem a podle hustoty.', href: 'identifikace-plastu.html', status: 'ready', badge: '2 animace', icon: 'flame' },
];
class Component extends DCLogic {
  state = { structure: null };
  componentDidMount() {
    fetch('../../site-structure.json').then(r => r.json()).then(structure => this.setState({ structure })).catch(() => {});
  }
  renderVals() {
    const s = this.state.structure;
    const raw = (s && s.zpracovaniPolymeruZaklady && s.zpracovaniPolymeruZaklady.cards) ? s.zpracovaniPolymeruZaklady.cards : CARDS;
    const cards = raw.map(c => {
      const ready = c.status === 'ready';
      return {
        title: c.title, desc: c.desc,
        iChain: c.icon === 'chain' || !c.icon, iBeaker: c.icon === 'beaker', iCurve: c.icon === 'curve', iGranules: c.icon === 'granules', iFlame: c.icon === 'flame',
        href: ready ? c.href : undefined,
        badge: c.badge || (ready ? 'Interaktivní' : 'Připravujeme'),
        cursor: ready ? 'pointer' : 'not-allowed',
        borderColor: ready ? '#e5ded2' : '#ece4d6',
        badgeBg: ready ? '#d6ecea' : '#eee5d8',
        badgeColor: ready ? '#1f7a73' : '#a39a8b',
        iconBg: ready ? '#d6ecea' : '#eee5d8',
        iconColor: ready ? '#1f7a73' : '#a39a8b',
        titleColor: ready ? '#231d16' : '#a39a8b',
        descColor: ready ? '#6b6255' : '#a39a8b',
      };
    });
    return { cards };
  }
}

    { title: 'Novinky', href: '../../novinky.html' },
  ];
  const rv = Component.prototype.renderVals;

    const n = this.state && this.state.__nav;
    const navItems = n ? n.map(i => ({ title: i.title, href: P + i.href })) : FALLBACK_NAV;
    return Object.assign({}, base, { navItems });
  };
  const cdm = Component.prototype.componentDidMount;
  Component.prototype.componentDidMount = function () {
    if (cdm) cdm.call(this);
    fetch(P + 'site-structure.json').then(r => r.json()).then(s => this.setState({ __nav: s.nav })).catch(() => {});
  };
})();
</script>
