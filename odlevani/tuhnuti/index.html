<script type="text/x-dc" data-dc-script>
const CARDS = [

];
const FALLBACK_NAV = [
  { title: 'Domů', href: '../../index.html' },
  { title: 'Vnitřní stavba kovů a\u00a0TZ', href: '../../vnitrni-stavba-kovu-a-tz/index.html?view=home' },

  { title: 'O projektu', href: '../../o-projektu.html' },
  { title: 'Novinky', href: '../../novinky.html' },
];
class Component extends DCLogic {
  state = { structure: null };
  componentDidMount() {
    fetch('../../site-structure.json').then(r => r.json()).then(structure => this.setState({ structure })).catch(() => {});
  }
  renderVals() {
    const s = this.state.structure;
    const raw = (s && s.odlevaniTuhnuti && s.odlevaniTuhnuti.cards) ? s.odlevaniTuhnuti.cards : CARDS;
    const cards = raw.map(c => {
      const ready = c.status === 'ready';
      const vtok = c.href === 'vtokova-soustava.html';
      const nal = c.href === 'nalitky.html';
      const tech = c.href === 'technologicnost.html';
      const vady = c.href === 'vady.html';
      return {
        title: c.title, desc: c.desc,
        ic: { vtok, nal, tech, vady, none: !vtok && !nal && !tech && !vady },
        href: ready ? c.href : undefined,
        badge: c.badge || (ready ? 'Kapitola' : 'Připravujeme'),
        cursor: ready ? 'pointer' : 'not-allowed',
        borderColor: ready ? '#e5ded2' : '#ece4d6',
        badgeBg: ready ? '#f3e3d4' : '#eee5d8',
        badgeColor: ready ? '#b0561f' : '#a39a8b',
        iconBg: ready ? '#f3e3d4' : '#eee5d8',
        iconColor: ready ? '#b0561f' : '#a39a8b',
        titleColor: ready ? '#231d16' : '#a39a8b',
        descColor: ready ? '#6b6255' : '#a39a8b',
      };
    });
    return { cards };
  }
}
(function () {

    const base = rv ? (rv.call(this) || {}) : {};
    const n = this.state && this.state.__nav;
    const navItems = n ? n.map(i => ({ title: i.title, href: P + i.href })) : FALLBACK_NAV;
    return Object.assign({}, base, { navItems });
  };
  const cdm = Component.prototype.componentDidMount;
  Component.prototype.componentDidMount = function () {
    if (cdm) cdm.call(this);
    fetch(P + 'site-structure.json').then(r => r.json()).then(s => this.setState({ __nav: s.nav })).catch(() => {});
  };
})();
</script>
