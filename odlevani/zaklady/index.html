  <script>
    document.addEventListener('mouseover', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el) el.style.maxHeight = el.scrollHeight + 'px'; });

<div class="site-nav-toggle" style="position:fixed;top:24px;right:24px;z-index:1000;width:220px;background:#fff;border:1px solid #e5ded2;border-radius:16px;box-shadow:0 2px 10px rgba(35,29,22,0.08);overflow:hidden;max-height:48px;transition:max-height 0.22s ease">
  <div style="height:48px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;cursor:pointer">
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
  </div>
  <div style="display:flex;flex-direction:column;border-top:1px solid #eee5d8">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">{{ n.title }}</a>
    </sc-for>
  </div>
</div>

<div style="min-height:100vh;background:#fbf8f3;font-family:'IBM Plex Sans',sans-serif;padding:56px 48px 80px;box-sizing:border-box">
  <div style="max-width:1080px;margin:0 auto 40px">
    <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14.5px;color:#8a8072;margin-bottom:18px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="#8a8072" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Zpět na Odlévání
    </a>
    <h1 style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:38px;line-height:1.15;color:#231d16;margin:0 0 12px">Základy slévárenství</h1>
    <p style="font-size:17px;line-height:1.6;color:#6b6255;max-width:620px;margin:0;text-wrap:pretty">Než začneš formovat, musíš vědět, jak se roztavený kov chová.</p>
  </div>

  <div style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
      <a href="{{ c.href }}" style="position:relative;display:flex;flex-direction:column;gap:16px;background:#faf7f1;border-radius:20px;padding:26px;border:1px solid {{ c.borderColor }};cursor:{{ c.cursor }}">
        <div style="position:absolute;top:16px;right:16px;padding:5px 10px;border-radius:999px;background:{{ c.badgeBg }};font-size:11px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;color:{{ c.badgeColor }};letter-spacing:0.04em;text-transform:uppercase">{{ c.badge }}</div>
        <div style="width:56px;height:56px;border-radius:14px;background:{{ c.iconBg }};display:flex;align-items:center;justify-content:center">
          <sc-if value="{{ c.icoForma }}" hint-placeholder-val="{{ true }}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" stroke="{{ c.iconColor }}" stroke-width="1.8"></rect><path d="M3.5 12h5M15.5 12h5" stroke="{{ c.iconColor }}" stroke-width="1.6"></path><circle cx="12" cy="12" r="3.4" stroke="{{ c.iconColor }}" stroke-width="1.7"></circle></svg>
          </sc-if>
          <sc-if value="{{ c.icoTok }}" hint-placeholder-val="{{ true }}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3c3.4 4.3 5.3 6.9 5.3 9.3a5.3 5.3 0 0 1-10.6 0C6.7 9.9 8.6 7.3 12 3z" stroke="{{ c.iconColor }}" stroke-width="1.8" stroke-linejoin="round"></path><path d="M9.2 12.6c1.1-1 2.2-1 3.3 0s2.2 1 3.3 0" stroke="{{ c.iconColor }}" stroke-width="1.5" stroke-linecap="round"></path></svg>
          </sc-if>
          <sc-if value="{{ c.icoTaveni }}" hint-placeholder-val="{{ true }}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4.5 7h15l-2 12H6.5L4.5 7z" stroke="{{ c.iconColor }}" stroke-width="1.8" stroke-linejoin="round"></path><path d="M7 12.2c1.7-1.6 3.3-1.6 5 0s3.3 1.6 5 0" stroke="{{ c.iconColor }}" stroke-width="1.6" stroke-linecap="round"></path><path d="M12 4.5V2.6" stroke="{{ c.iconColor }}" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </sc-if>
        </div>
        <div>
          <div style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:19px;color:{{ c.titleColor }};margin-bottom:6px">{{ c.title }}</div>
          <div style="font-size:14.5px;line-height:1.5;color:{{ c.descColor }};text-wrap:pretty">{{ c.desc }}</div>
        </div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CARDS = [
  { title: 'Základní pojmy a princip lití', desc: 'Odlitek, forma, model, jádro — slovník, ze kterého čerpá celá kapitola.', href: 'zakladni-pojmy.html', status: 'ready', badge: 'Interaktivní' },
  { title: 'Slévárenské vlastnosti slitin', desc: 'Zabíhavost, smrštivost, segregace: proč se každá slitina lije jinak.', href: 'vlastnosti-slitin.html', status: 'coming-soon', badge: 'Připravujeme' },
  { title: 'Tavení a příprava taveniny', desc: 'Kuplovna, indukční pec, očkování a modifikace.', href: 'taveni.html', status: 'coming-soon', badge: 'Připravujeme' },
];
const FALLBACK_NAV = [
  { title: 'Domů', href: '../../index.html' },
  { title: 'Vnitřní stavba kovů a TZ', href: '../../vnitrni-stavba-kovu-a-tz/index.html?view=home' },
  { title: 'Koroze', href: '../../koroze/index.html' },
  { title: 'Tváření', href: '../../tvareni-za-tepla/index.html' },
  { title: 'Prášková metalurgie', href: '../../praskova-metalurgie/index.html' },
  { title: 'Značení ocelí', href: '../../znaceni-oceli/index.html' },
  { title: 'Odlévání', href: '../index.html' },
  { title: 'O projektu', href: '../../o-projektu.html' },
  { title: 'Novinky', href: '../../novinky.html' },
];
class Component extends DCLogic {
  state = { structure: null };
  componentDidMount() {
    fetch('../../site-structure.json').then(r => r.json()).then(structure => this.setState({ structure })).catch(() => {});
  }
  renderVals() {
    const s = this.state.structure;
    const SELF = 'odlevani/';
    const navItems = s ? s.nav.map(n => ({ title: n.title, href: n.href.startsWith(SELF) ? '../' + n.href.slice(SELF.length) : '../../' + n.href })) : FALLBACK_NAV;
    const raw = (s && s.odlevaniZaklady && s.odlevaniZaklady.cards) ? s.odlevaniZaklady.cards : CARDS;
    const cards = raw.map(c => {
      const ready = c.status === 'ready';
      const h = c.href || '';
      return {
        icoForma: h.indexOf('zakladni-pojmy') === 0,
        icoTok: h.indexOf('vlastnosti-slitin') === 0,
        icoTaveni: h.indexOf('zakladni-pojmy') !== 0 && h.indexOf('vlastnosti-slitin') !== 0,
        title: c.title, desc: c.desc,
        href: ready ? c.href : undefined,
        badge: c.badge || (ready ? 'Kapitola' : 'Připravujeme'),
        cursor: ready ? 'pointer' : 'not-allowed',
        borderColor: ready ? '#e5ded2' : '#ece4d6',
        badgeBg: ready ? '#f3e3d4' : '#eee5d8',
        badgeColor: ready ? '#b0561f' : '#a39a8b',
        iconBg: ready ? '#f3e3d4' : '#eee5d8',
        iconColor: ready ? '#b0561f' : '#a39a8b',
        titleColor: ready ? '#231d16' : '#a39a8b',
        descColor: ready ? '#6b6255' : '#a39a8b',
      };
    });
    return { navItems, cards };
  }
}
</script>

  if (isNaN(seen)) return;
  if (Date.now() - seen.getTime() >= 30 * 864e5) return;
  var run = function(){
    var h = document.querySelector("h1");
    if (!h || h.querySelector(".stt-novinka")) return;
    var s = document.createElement("span");
    s.className = "stt-novinka";
    s.textContent = "Novinka";
    h.appendChild(s);
  };
  if (document.readyState === "loading")
